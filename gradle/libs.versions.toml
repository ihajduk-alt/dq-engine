[versions]
junit = "6.1.3"
assertj = "3.27.7"
jackson = "3.3.0"
lombok = "1.18.48"
spring-boot = "4.1.2"
wiremock = "3.13.2"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-expression = { module = "org.springframework:spring-expression" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
spring-test = { module = "org.springframework:spring-test" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
